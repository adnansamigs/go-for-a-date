<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Will you go on a date with me?</title>
<style>
:root{
  --bg1:#ffe3ea;--bg2:#ffd0dd;--card:#fffafb;--ink:#4a1d2e;--muted:#8a5a6c;
  --rose:#e8456b;--rose-d:#c92e55;--line:#f4b9c8;--soft:#fff0f4;--bubble:#fff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg1:#2a1020;--bg2:#3c1630;--card:#3a1b2e;--ink:#ffe8ef;--muted:#e0a9bd;
  --rose:#ff6b8f;--rose-d:#ff4d78;--line:#6a2d4a;--soft:#4a2038;--bubble:#4a2038;}}
:root[data-theme="dark"]{--bg1:#2a1020;--bg2:#3c1630;--card:#3a1b2e;--ink:#ffe8ef;--muted:#e0a9bd;--rose:#ff6b8f;--rose-d:#ff4d78;--line:#6a2d4a;--soft:#4a2038;--bubble:#4a2038}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:grid;place-items:center;padding:20px;overflow-x:hidden}
.floaters{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.floaters span{position:absolute;bottom:-40px;font-size:22px;opacity:.5;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg)}}
@media (prefers-reduced-motion:reduce){.floaters{display:none}*{animation-duration:.01s!important;transition-duration:.01s!important}}
main{position:relative;z-index:1;width:min(440px,100%);text-align:center}
.stage{display:flex;flex-direction:column;align-items:center}
.bubble{position:relative;background:var(--bubble);border:2px solid var(--line);border-radius:20px;padding:12px 16px;
  font-size:17px;line-height:1.35;max-width:340px;min-height:52px;display:grid;place-items:center;margin-bottom:14px;box-shadow:0 6px 0 var(--line)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-11px;width:18px;height:18px;background:var(--bubble);
  border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.bubble.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
#mochi{width:170px;height:170px;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 8px 0 rgba(0,0,0,.06))}
@keyframes bob{50%{transform:translateY(-8px)}}
#mochi.jump{animation:jump .6s}
@keyframes jump{30%{transform:translateY(-34px) scale(1.05)}60%{transform:translateY(0) scale(.96,1.05)}}
#mochi.shake{animation:shake .4s}
@keyframes shake{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.eye-blink{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.card{background:var(--card);border:2px solid var(--line);border-radius:28px;padding:24px 20px 26px;margin-top:18px;box-shadow:0 10px 0 var(--line)}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(28px,7vw,36px);line-height:1.15;margin:0 0 6px;letter-spacing:-.01em}
.sub{margin:0 0 20px;color:var(--muted);font-size:15px}
.row{display:flex;gap:16px;justify-content:center;align-items:center;min-height:70px}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
#yes,.go{background:var(--rose);color:#fff;font-weight:700;font-size:20px;padding:14px 34px;border-radius:999px;box-shadow:0 5px 0 var(--rose-d);
  transition:transform .15s,box-shadow .15s}
#yes{transform:scale(var(--s,1));transform-origin:center}
#yes:hover,.go:hover:not(:disabled){transform:scale(calc(var(--s,1) * 1.06)) translateY(-1px)}
#yes:active,.go:active:not(:disabled){box-shadow:0 1px 0 var(--rose-d);transform:translateY(4px) scale(var(--s,1))}
#no{background:var(--soft);color:var(--muted);font-weight:700;font-size:18px;padding:12px 28px;border-radius:999px;border:2px solid var(--line);
  pointer-events:none;user-select:none;-webkit-user-select:none;transition:left .28s cubic-bezier(.3,1.6,.5,1),top .28s cubic-bezier(.3,1.6,.5,1);z-index:5}
#no.free{position:fixed}
.hidden{display:none!important}
label{display:block;text-align:left;font-weight:700;font-size:14px;margin:14px 0 6px}
input[type=date],input[type=time]{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--soft);color:var(--ink);color-scheme:light dark}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--soft);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:9px 14px;font-size:15px;font-weight:600}
.chip[aria-pressed=true]{background:var(--rose);border-color:var(--rose-d);color:#fff}
.go{width:100%;margin-top:22px}
.go:disabled{opacity:.45;cursor:not-allowed;box-shadow:0 5px 0 var(--rose-d)}
.when{font-family:Georgia,serif;font-size:22px;line-height:1.3;margin:6px 0 4px}
.again{background:none;color:var(--muted);text-decoration:underline;font-size:14px;margin-top:16px;padding:6px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#boom{position:fixed;left:50%;top:42%;z-index:60;pointer-events:none;font-family:Georgia,serif;font-weight:900;font-size:clamp(64px,22vw,150px);
  color:var(--rose);-webkit-text-stroke:4px #fff;transform:translate(-50%,-50%) scale(0);opacity:0}
#boom.go-boom{animation:boom 1.1s ease-out}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(0) rotate(-12deg);opacity:1}35%{transform:translate(-50%,-50%) scale(1.25) rotate(4deg);opacity:1}100%{transform:translate(-50%,-50%) scale(1.6) rotate(0);opacity:0}}
.ring{position:fixed;left:50%;top:42%;width:20px;height:20px;border-radius:50%;border:6px solid var(--rose);z-index:55;pointer-events:none;transform:translate(-50%,-50%);animation:ring .9s ease-out forwards}
@keyframes ring{to{width:140vmax;height:140vmax;opacity:0;border-width:1px}}
</style>
</head>
<body>
<div class="floaters" id="floaters" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="boom" aria-hidden="true">BOOM!</div>

<main>
  <div class="stage">
    <div class="bubble" id="bubble" role="status" aria-live="polite">Psst… I'm Mochi, the love bunny. I have a question for you!</div>
    <svg id="mochi" viewBox="0 0 160 160" role="img" aria-label="Mochi the love bunny">
      <g fill="#fff" stroke="#f4b9c8" stroke-width="3"><ellipse cx="24" cy="92" rx="18" ry="30" transform="rotate(-24 24 92)"/><ellipse cx="136" cy="92" rx="18" ry="30" transform="rotate(24 136 92)"/></g>
      <g fill="#fff5f7" stroke="#ff8fab" stroke-width="3"><ellipse cx="56" cy="30" rx="13" ry="30" transform="rotate(-8 56 30)"/><ellipse cx="104" cy="30" rx="13" ry="30" transform="rotate(8 104 30)"/></g>
      <g fill="#ffc2d1"><ellipse cx="56" cy="32" rx="6" ry="20" transform="rotate(-8 56 32)"/><ellipse cx="104" cy="32" rx="6" ry="20" transform="rotate(8 104 32)"/></g>
      <circle cx="80" cy="96" r="52" fill="#fff5f7" stroke="#ff8fab" stroke-width="3"/>
      <ellipse cx="52" cy="108" rx="9" ry="6" fill="#ff9db5" opacity=".7"/><ellipse cx="108" cy="108" rx="9" ry="6" fill="#ff9db5" opacity=".7"/>
      <g class="eye-blink"><circle cx="60" cy="92" r="10" fill="#fff" stroke="#4a1d2e" stroke-width="2"/><circle cx="100" cy="92" r="10" fill="#fff" stroke="#4a1d2e" stroke-width="2"/>
      <g id="pupils"><circle id="pl" cx="60" cy="92" r="5.5" fill="#4a1d2e"/><circle id="pr" cx="100" cy="92" r="5.5" fill="#4a1d2e"/></g></g>
      <path d="M76 103 L84 103 L80 108 Z" fill="#ff6b8f"/>
      <path id="mouth" d="M68 112 Q80 122 92 112" fill="none" stroke="#4a1d2e" stroke-width="3" stroke-linecap="round"/>
      <path d="M80 50 C80 42 70 40 70 47 C70 53 80 58 80 58 C80 58 90 53 90 47 C90 40 80 42 80 50Z" fill="#e8456b" transform="translate(0 -4)"/>
    </svg>
  </div>

  <section class="card" id="ask">
    <h1>Will you go on a date with me?</h1>
    <p class="sub">Let's goo jaan!!!!</p>
    <div class="row" id="row">
      <button id="yes" type="button">Yes 💖</button>
      <button id="no" type="button" tabindex="-1" aria-hidden="true">No</button>
    </div>
  </section>

  <section class="card hidden" id="pick">
    <h1>Yay! Pick your day</h1>
    <p class="sub">Choose a date, a time, and a plan.</p>
    <label for="date">Date</label>
    <input type="date" id="date">
    <label for="time">Time</label>
    <input type="time" id="time" value="18:00">
    <label id="planLabel">Plan</label>
    <div class="chips" role="group" aria-labelledby="planLabel" id="chips">
      <button class="chip" type="button" aria-pressed="true">☕ Coffee</button>
      <button class="chip" type="button" aria-pressed="false">🍽️ Dinner</button>
      <button class="chip" type="button" aria-pressed="false">🎬 Movie</button>
      <button class="chip" type="button" aria-pressed="false">🌳 Walk</button>
    </div>
    <button class="go" id="confirm" type="button" disabled>Lock in the date</button>
  </section>

  <section class="card hidden" id="done">
    <h1>LOOOOVEEEEEE YOUUUUU JAAAANNN! 🎉</h1>
    <p class="sub">Finallyy,,, yeyyyyy !!!! Ummmaaahhhhh. DEkha hobe ne abar kichu memories create korte!</p>
    <div class="when" id="when"></div>
    <div class="sub" id="plan" style="margin:0"></div>
    <button class="again" id="again" type="button">Start over</button>
  </section>
</main>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var bubble=$('bubble'),mouth=$('mouth'),mochi=$('mochi'),no=$('no'),yes=$('yes'),row=$('row');
  var MOUTH={happy:'M68 112 Q80 122 92 112',sad:'M68 118 Q80 108 92 118',wow:'M70 110 Q80 128 90 110 Z'};
  function say(t,mood){bubble.textContent=t;bubble.classList.remove('pop');void bubble.offsetWidth;bubble.classList.add('pop');
    mouth.setAttribute('d',MOUTH[mood||'happy']);mouth.setAttribute('fill',mood==='wow'?'#ff6b8f':'none')}
  function anim(c){mochi.classList.remove('jump','shake');void mochi.offsetWidth;mochi.classList.add(c)}

  /* floating hearts */
  var f=$('floaters'),em=['💗','💕','✨','💖','🌸'];
  for(var i=0;i<14;i++){var s=document.createElement('span');s.textContent=em[i%em.length];
    s.style.left=(Math.random()*100)+'%';s.style.animationDuration=(12+Math.random()*14)+'s';s.style.animationDelay=(-Math.random()*20)+'s';
    s.style.fontSize=(16+Math.random()*20)+'px';f.appendChild(s)}

  /* eyes follow pointer */
  var pl=$('pl'),pr=$('pr');
  document.addEventListener('pointermove',function(e){
    var r=mochi.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*.6;
    var dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy)||1,k=Math.min(4,d/40);
    var ox=dx/d*k,oy=dy/d*k;
    pl.setAttribute('cx',60+ox);pl.setAttribute('cy',92+oy);pr.setAttribute('cx',100+ox);pr.setAttribute('cy',92+oy);
  });

  /* the unreachable "No" */
  var lines=["Oops, the No button got shy! 🙈","Nope, can't catch it!","Please jaan. Press Yes instead? 💖","do you not want to make some memories?,press yes please 🏖️","That button is very, very slippery!","Okay okay, Yes looks lovely today 😊","I'll be sad if you keep chasing it 🥺","Fine. Yes is getting bigger. Just saying."];
  var dodges=0,free=false,asking=true;
  function place(x,y){no.style.left=x+'px';no.style.top=y+'px'}
  function dodge(px,py){
    if(!asking)return;
    var w=no.offsetWidth,h=no.offsetHeight,vw=window.innerWidth,vh=window.innerHeight,m=12;
    if(!free){var r=no.getBoundingClientRect();no.classList.add('free');place(r.left,r.top);free=true;void no.offsetWidth}
    var best=null,bd=-1;
    for(var i=0;i<14;i++){
      var x=m+Math.random()*(vw-w-2*m),y=m+Math.random()*(vh-h-2*m),d=Math.hypot(x+w/2-px,y+h/2-py);
      if(d>bd){bd=d;best={x:x,y:y}}
    }
    place(best.x,best.y);dodges++;
    yes.style.setProperty('--s',Math.min(1.7,1+dodges*.07));
    say(lines[(dodges-1)%lines.length],'sad');anim('shake');
  }
  function near(e){
    if(!asking)return;
    var r=no.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    var dx=Math.max(Math.abs(e.clientX-cx)-r.width/2,0),dy=Math.max(Math.abs(e.clientY-cy)-r.height/2,0);
    if(Math.hypot(dx,dy)<(e.pointerType==='touch'?70:55))dodge(e.clientX,e.clientY);
  }
  document.addEventListener('pointermove',near);
  document.addEventListener('pointerdown',near);
  window.addEventListener('resize',function(){if(free){var r=no.getBoundingClientRect();
    place(Math.min(r.left,window.innerWidth-r.width-8),Math.min(r.top,window.innerHeight-r.height-8))}});

  /* Yes -> date picker */
  var dateIn=$('date'),confirm=$('confirm');
  var t=new Date();t.setMinutes(t.getMinutes()-t.getTimezoneOffset());dateIn.min=t.toISOString().slice(0,10);
  yes.addEventListener('click',function(){
    asking=false;no.classList.add('hidden');
    $('ask').classList.add('hidden');$('pick').classList.remove('hidden');
    say("YeeeY!! 🥹 Jann, just bolo kuthay jaba. Now pick the perfect day for us!",'wow');anim('jump');mini(.5,.3,40);
  });
  dateIn.addEventListener('change',function(){
    confirm.disabled=!dateIn.value;
    if(dateIn.value)say("Ooh, choloooooooo!!!!! yeaaayyyy Pick a plan and lock it in 💘",'happy');
  });
  var plan='☕ Coffee';
  $('chips').addEventListener('click',function(e){
    var b=e.target.closest('.chip');if(!b)return;
    [].forEach.call(this.children,function(c){c.setAttribute('aria-pressed',c===b)});plan=b.textContent;
  });

  /* celebration */
  var cv=$('fx'),ctx=cv.getContext('2d'),parts=[],raf=0;
  function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
  size();addEventListener('resize',size);
  var cols=['#ff4d78','#ffd166','#fff','#ff9db5','#8ecae6','#b8f2a6','#c77dff'];
  function mini(px,py,n){for(var i=0;i<n;i++)add(px*innerWidth,py*innerHeight,Math.random()*Math.PI*2,2+Math.random()*7)}
  function add(x,y,a,v){parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,r:4+Math.random()*5,c:cols[Math.random()*cols.length|0],
    rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:1,h:Math.random()<.3})}
  function burst(px,py,n,v){for(var i=0;i<n;i++)add(px*innerWidth,py*innerHeight,Math.random()*Math.PI*2,Math.random()*v+2)}
  function heart(c,s){c.beginPath();c.moveTo(0,s*.35);c.bezierCurveTo(-s,-s*.3,-s*.4,-s,0,-s*.4);c.bezierCurveTo(s*.4,-s,s,-s*.3,0,s*.35);c.fill()}
  function loop(){
    var d=devicePixelRatio;ctx.clearRect(0,0,cv.width,cv.height);
    parts=parts.filter(function(p){return p.life>0&&p.y<innerHeight+40});
    parts.forEach(function(p){
      p.vy+=.14;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=.006;
      ctx.save();ctx.translate(p.x*d,p.y*d);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.globalAlpha=Math.max(p.life,0);
      if(p.h)heart(ctx,p.r*d*1.6);else ctx.fillRect(-p.r*d/2,-p.r*d/3,p.r*d,p.r*d*.6);
      ctx.restore();
    });
    raf=parts.length?requestAnimationFrame(loop):0;
  }
  function kick(){if(!raf)raf=requestAnimationFrame(loop)}
  var _add=add;add=function(){_add.apply(null,arguments);kick()};

  function sound(){
    try{
      var A=window.AudioContext||window.webkitAudioContext,a=new A(),o=a.createOscillator(),g=a.createGain();
      o.type='sine';o.frequency.setValueAtTime(170,a.currentTime);o.frequency.exponentialRampToValueAtTime(35,a.currentTime+.5);
      g.gain.setValueAtTime(.7,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.6);
      o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.6);
      [523,659,784,1046].forEach(function(f,i){var o2=a.createOscillator(),g2=a.createGain();o2.type='triangle';o2.frequency.value=f;
        var s=a.currentTime+.35+i*.1;g2.gain.setValueAtTime(.001,s);g2.gain.linearRampToValueAtTime(.18,s+.03);g2.gain.exponentialRampToValueAtTime(.001,s+.5);
        o2.connect(g2);g2.connect(a.destination);o2.start(s);o2.stop(s+.5)});
    }catch(e){}
  }

  confirm.addEventListener('click',function(){
    if(!dateIn.value)return;
    var p=dateIn.value.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);
    var ds=d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    var tv=$('time').value,ts='';
    if(tv){var q=tv.split(':'),h=+q[0],ap=h>=12?'PM':'AM';ts=' at '+((h%12)||12)+':'+q[1]+' '+ap}
    $('when').textContent=ds+ts;$('plan').textContent='Plan: '+plan;
    $('pick').classList.add('hidden');$('done').classList.remove('hidden');
    say("It's official!! I'm doing a happy dance 💃 Get ready for the best day!",'wow');anim('jump');
    var b=$('boom');b.classList.remove('go-boom');void b.offsetWidth;b.classList.add('go-boom');
    var r=document.createElement('div');r.className='ring';document.body.appendChild(r);setTimeout(function(){r.remove()},1000);
    sound();burst(.5,.42,140,13);
    setTimeout(function(){burst(.2,.35,70,10);burst(.8,.35,70,10)},350);
    setTimeout(function(){burst(.5,.2,90,9)},800);
    if(navigator.vibrate)try{navigator.vibrate([80,40,120])}catch(e){}
  });

  $('again').addEventListener('click',function(){
    $('done').classList.add('hidden');$('ask').classList.remove('hidden');
    no.classList.remove('hidden','free');no.style.left=no.style.top='';free=false;asking=true;dodges=0;
    yes.style.setProperty('--s',1);dateIn.value='';confirm.disabled=true;
    say("Round two! Same question… will you go on a date with me?");
  });
})();
</script>
</body>
</html>
